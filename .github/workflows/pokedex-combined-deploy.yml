# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Deploy Pokédex Combined with Angular and Spring Boot

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Pokédex Combined with Angular and Spring Boot
        run: npm run deployAngularAppForServer

      - name: Upload Pokédex Combined with Angular and Spring Boot
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist/pokedexapiui"
          target: "/tmp/deploy"

      - name: Copy Previous Working Version, Deploy New Version
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Stop script on a failing command rather than blindly continuing
            set -e

            # Verify uploaded build before touching production
            test -d /tmp/deploy/dist/pokedexapiui

            # Stop Tomcat 11 Service
            sudo systemctl stop tomcat11

            # Copy Previous Working Version
            cd /opt/tomcat11
            sudo rm -rf MyPokedexBackup/combined
            sudo mkdir -p MyPokedexBackup/combined
            sudo cp -a MyPokedex/combined/. MyPokedexBackup/combined/

            # Prepare New Version
            sudo rm -rf MyPokedex/combined
            sudo mv /tmp/deploy/dist/pokedexapiui /opt/tomcat11/MyPokedex/combined

            cd /opt/tomcat11/MyPokedex/combined
            sudo cp -a browser/. .
            sudo rm -rf browser

            # Update Ownership
            sudo chown -R tomcat:tomcat /opt/tomcat11/MyPokedex/combined
            sudo chown -R tomcat:tomcat /opt/tomcat11/MyPokedexBackup/combined

            # Update Permissions
            sudo find /opt/tomcat11/MyPokedex/combined -type d -exec chmod 755 {} \;
            sudo find /opt/tomcat11/MyPokedex/combined -type f -exec chmod 644 {} \;

            # Start Tomcat 11 Service
            sudo systemctl start tomcat11
            timeout 120 bash -c 'until sudo systemctl is-active --quiet tomcat11; do sleep 3; done'
            sudo journalctl -u tomcat11 -n 100 --no-pager
